<section id="newsletter" class="section contact-section">
  <div class="container">
    @if (submitted) {
      <div class="contact-success">
        <h3>Merci pour votre message !</h3>
        <p>Nous vous répondrons dans les plus brefs délais.</p>
      </div>
    } @else {
      <form id="contactus" (submit)="onSubmit($event)">
        <h3>CONTACTEZ-NOUS</h3>
        <fieldset>
          <input name="influnias-name" placeholder="Nom" type="text" tabindex="1" required>
        </fieldset>
        <fieldset>
          <input name="influnias-email" placeholder="Email" type="email" tabindex="2" required>
        </fieldset>
        <fieldset>
          <textarea name="influnias-text" placeholder="Tapez votre message ici..." tabindex="5" required></textarea>
        </fieldset>
        <fieldset>
          <button type="submit" [disabled]="sending">
            {{ sending ? '...Envoi en cours' : 'Envoyer' }}
          </button>
        </fieldset>
      </form>
    }
  </div>
</section>
