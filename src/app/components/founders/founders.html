<section id="founder" class="founders-section">
  <div class="container">

    <div class="founders-header">
      <span class="founders-label">L'équipe fondatrice</span>
      <h2>FONDATEURS</h2>
      <p>Influnias est né de la vision de deux passionnés du digital, convaincus que chaque créateur mérite un vrai accompagnement.</p>
    </div>

    <div class="founders-grid">
      @for (founder of founders; track founder.name) {
        <div class="founder-card">
          <div class="founder-photo-wrap">
            <div class="founder-photo" [style.background-image]="'url(' + founder.photo + ')'"></div>
          </div>
          <div class="founder-quote-wrap">
            <i class="ri-double-quotes-l quote-icon"></i>
            <p class="founder-quote">{{ founder.text }}</p>
          </div>
          <div class="founder-sep"></div>
          <div class="founder-meta">
            <strong class="founder-name">{{ founder.name }}</strong>
            <span class="founder-role">{{ founder.role }}</span>
          </div>
        </div>
      }
    </div>

  </div>
</section>
